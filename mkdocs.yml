site_name: Documentation et Tutos sur les données géographiques du Parc national du Mercantour
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.prune
    - navigation.indexes #supprime l'index.md de la liste des onglets à gauche
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - toc.follow
    #- toc.integrate
  logo: tutos/img/logo_embleme_pnm_quadri_vert.jpg
  favicon: tutos/img/logo_embleme_pnm_quadri_vert.jpg
  language: fr
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline 
        name: Mode Sombre
      primary: teal
      accent: deep orange 
    - scheme: slate 
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode    
      primary: teal
      accent: deep orange

plugins:
  - search
  - git-revision-date-localized:
      enabled: true
      type: timeago
      enable_creation_date: true
      locale: fr


markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.keys
  - def_list
  - md_in_html
  - pymdownx.tasklist:
        custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji 
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  #- toc:
  #    permalink: true

exclude_docs: |
  /tutos/git.md
  */_modele.md
  */Surveillance_TourdeFrance.md
  *.tmp


extra_css:
  - stylesheets/extra.css

nav:
  - Page d'accueil: index.md
  - BD_PNM:
    - Accueil et liste des schémas: bd_pnm/index.md
    - Limites et territoire:
        - admin_express: bd_pnm/admin_express.md
        - limites: bd_pnm/limites.md
        - inpn: bd_pnm/inpn.md
        - cadastre: bd_pnm/cadastre.md
    - Biodiversité et millieux naturels: 
        - geonature_synthese: bd_pnm/geonature_synthese.md
        - bd_lacs: bd_pnm/bd_lacs.md
        - bd_source: bd_pnm/bd_source.md
        - foret: bd_pnm/foret.md
        - habitats: bd_pnm/habitats.md
        - vegetation: bd_pnm/vegetation.md
    - Gestion et fréquentation:
        - ag_pasto: bd_pnm/ag_pasto.md
        - geotrek: bd_pnm/geotrek.md
        - PAEC: bd_pnm/paec.md
        - tourisme: bd_pnm/tourisme.md
    - Réglementation et zonages:
        - charte: bd_pnm/charte.md
        - rice: bd_pnm/rice.md
        - survol: bd_pnm/survol.md
    
  - Projets Qgis:
    - Accueil et liste des projets: projets_qgis/index.md
    - Limites et territoire:
        - admin_express: projets_qgis/admin_express.md
        - cadastre: projets_qgis/cadastre.md
        - inpn: projets_qgis/inpn.md
    - Biodiversité et millieux naturels:
        - geonature_synthese: projets_qgis/geonature_synthese.md
        - foret: projets_qgis/foret.md
        - habitats: projets_qgis/habitats.md
    - Gestion et fréquentation:
        - geotrek: projets_qgis/geotrek.md
    - Réglementation et zonages:
        - rice: projets_qgis/rice.md
  - Qgis plugins:
